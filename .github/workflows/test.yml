name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual runs on any branch: Actions tab → Tests → "Run workflow",
  # or `gh workflow run test.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # setup-uv also provisions Python: python-version sets UV_PYTHON, which
      # overrides .python-version for this matrix leg.
      # uv 0.12.17 is the newest release with a checksum embedded in v10.2.0.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest tests/ -v --tb=short

  lock-and-export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --locked --no-dev -o requirements.txt --quiet
          git diff --exit-code requirements.txt
